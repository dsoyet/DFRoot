name: Build

on:
  push:
    branches: [master, main, codex/violin-ksu310]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  validate-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test strict ELF patcher
        run: python3 -m unittest discover -s tests -v
      - name: Check bootstrap C sources
        run: cc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror -fsyntax-only app/src/main/jni/bootstrap.c app/src/main/jni/violin.c app/src/main/jni/violin_patch.c

  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Restore compiled bootstrap module
        id: lkm-cache
        uses: actions/cache@v4
        with:
          path: out/dfroot-${{ matrix.kmi }}.ko
          key: dfroot-lkm-${{ matrix.kmi }}-ddk20260828-${{ hashFiles('lkm/dfroot.c', 'lkm/Makefile') }}

      - name: Build dfroot.ko
        if: steps.lkm-cache.outputs.cache-hit != 'true'
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v4
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

  build-dfroot:
    needs: [build-lkms, validate-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate signing config
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "No release signing secrets: building an installable debug APK."
          fi

      - name: Create signing.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then exit 0; fi
          echo KEYSTORE_FILE=../keystore.jks > signing.properties
          printf 'KEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" >> signing.properties
          printf '%s' "$KEYSTORE" | base64 --decode > keystore.jks

      - name: Download DF LKMs
        uses: actions/download-artifact@v4
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Preserve debug signing identity for subsequent builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: violin-debug-keystore-v1

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Fetch and verify pinned KernelSU 3.1.0 payloads
        run: python3 scripts/fetch-violin-payloads.py

      - name: Build DFRoot APK
        run: |
          chmod +x gradlew
          if [ ! -f signing.properties ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            ./gradlew :app:assembleRelease --stacktrace
          fi

      - name: Upload DFRoot APK
        uses: actions/upload-artifact@v4
        with:
          name: DFRoot
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/DFRoot_*.apk
            app/build/outputs/apk/debug/DFRoot_*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && hashFiles('signing.properties') != ''
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/DFRoot_*.apk
